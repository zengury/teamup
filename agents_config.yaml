# 每个 agent 独立配置 LLM
# provider 可选值:
#   - anthropic           Anthropic 官方 API
#   - openai              OpenAI 官方 API
#   - openai_compatible   任何 OpenAI 协议兼容的 API（DeepSeek/Qwen/Moonshot/智谱/本地 vLLM 等）
#
# 切换 provider 只需修改本文件，无需改动代码。

elon:
  # CEO 编排器 —— 必须支持 tool use 和长上下文，强烈建议 Anthropic
  provider: anthropic
  model: claude-opus-4-7
  max_tokens: 16384
  thinking: adaptive

jobs:
  # 产品经理 —— 需要结构化思考，推荐 Claude / GPT
  provider: anthropic
  model: claude-opus-4-7
  max_tokens: 8192
  thinking: adaptive

linux:
  # 软件工程师 —— 代码能力优先
  provider: anthropic
  model: claude-opus-4-7
  max_tokens: 8192
  thinking: adaptive

turing:
  # QA 工程师 —— 示例：用 OpenAI 走另一个模型，互为验证
  provider: openai
  model: gpt-5
  max_tokens: 8192
  api_key_env: OPENAI_API_KEY

bezos:
  # 客户成功 —— 中文场景多，示例：用国内模型节省成本
  provider: openai_compatible
  model: deepseek-chat
  max_tokens: 8192
  base_url: https://api.deepseek.com/v1
  api_key_env: DEEPSEEK_API_KEY

