<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#D4943A">
  <title>{% block title %}SweetLoaf 技能系統{% endblock %} | SweetLoaf 台南</title>
  <link rel="stylesheet" href="/static/css/style.css">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- Toast 通知 -->
  <div id="toast" class="toast"></div>

  <!-- 当前用户 ID（供 JS 读取） -->
  {% if user %}
  <input type="hidden" id="current-user-id" value="{{ user.id }}">
  {% endif %}

  <!-- 页面内容 -->
  {% block content %}{% endblock %}

  <!-- 底部导航（仅登录后显示） -->
  {% if user %}
  <nav class="bottom-nav">
    <a href="/dashboard" class="{% if request.path == '/dashboard' %}active{% endif %}">
      <span class="nav-icon">📊</span>
      看板
    </a>
    <a href="/skills" class="{% if request.path == '/skills' %}active{% endif %}">
      <span class="nav-icon">📚</span>
      技能庫
    </a>
    <a href="/skill/create" class="{% if request.path == '/skill/create' %}active{% endif %}">
      <span class="nav-icon">✨</span>
      創建
    </a>
    <a href="/employee/{{ user.id }}" class="{% if '/employee/' in request.path %}active{% endif %}">
      <span class="nav-icon">🗺️</span>
      我的地圖
    </a>
    <a href="/workflows" class="{% if request.path == '/workflows' %}active{% endif %}">
      <span class="nav-icon">⚙️</span>
      流程
    </a>
  </nav>
  {% endif %}

  <script src="/static/js/app.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
